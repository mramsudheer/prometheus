groups:
- name: high-cpu-usage
  labels:
    team: monitoring
  rules:
  - alert: HighCPUUsage
    expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 70
    for: 2m # wait for 2min before raising alert
    keep_firing_for: 5m
    labels:
      severity: Critical
    annotations:
      summary: High CPU Usage in server {{ $labels.app }}